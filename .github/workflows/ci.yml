name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:lib
      - run: bun run build:bin
      - run: docker build -t postfetch:ci .
      - run: docker run --rm -d --name postfetch-ci -p 127.0.0.1:3040:3040 postfetch:ci
      - run: bun run e2e -- --platform=tiktok,instagram
      - continue-on-error: true
        run: bun run e2e -- --platform=youtube
      - if: always()
        run: docker logs postfetch-ci || true
      - if: always()
        run: docker stop postfetch-ci || true
