name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  docs:
    # Keep every exported symbol documented (and free of slow types) — that is
    # what drives the JSR score. Runs without node_modules so deno analyses the
    # zero-dependency source directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno doc --lint --unstable-sloppy-imports packages/core/src/index.ts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t postfetch:ci .

  container-e2e:
    # Builds the showcase image and resolves real posts through the running
    # container end-to-end. Non-gating: datacenter IPs are sometimes throttled.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t postfetch:e2e .
      - name: Resolve real posts through the container
        run: |
          docker run -d --rm -p 3040:3040 --name postfetch postfetch:e2e
          trap 'docker stop postfetch >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null "http://127.0.0.1:3040/?url=https://vt.tiktok.com/ZSxpHvCUM/" && break || sleep 2
          done
          for url in \
            "https://vt.tiktok.com/ZSxpHvCUM/" \
            "https://www.instagram.com/reel/DZ0ixNxtvYq/"; do
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:3040/?url=$url")
            echo "$url -> $type"
            case "$type" in video/mp4|application/zip) ;; *) echo "unexpected content-type"; exit 1 ;; esac
          done

  live:
    # One job per platform for at-a-glance visibility — a red `live (youtube)`
    # is unmistakably YouTube's datacenter-IP bot gate, not a broken resolver.
    # Guards the original regression (a reel resolving to its cover image) and
    # proves the rotating fingerprints are not all blocked. Runner egress is a
    # datacenter IP that some platforms gate, so traffic goes through a free
    # Cloudflare WARP proxy (userspace wgcf + wireproxy, no privileges) to look
    # like a consumer IP; the jobs still report without gating merges.
    name: live (${{ matrix.platform }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [instagram, tiktok, youtube, facebook, twitter, reddit, pinterest, soundcloud]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Resolve through a Cloudflare WARP proxy
        env:
          POSTFETCH_LIVE: "1"
          POSTFETCH_LIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/v2.2.31/wgcf_2.2.31_linux_amd64" -o wgcf
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/v1.1.2/wireproxy_linux_amd64.tar.gz" | tar -xz wireproxy
          chmod +x wgcf wireproxy
          ./wgcf register --accept-tos
          ./wgcf generate
          printf '\n[http]\nBindAddress = 127.0.0.1:8080\n' >>wgcf-profile.conf
          ./wireproxy --config wgcf-profile.conf &
          trap 'kill $! 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q 'warp=on' && break
            sleep 2
          done
          curl -fsS -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='
          export HTTP_PROXY=http://127.0.0.1:8080 HTTPS_PROXY=http://127.0.0.1:8080
          cd "$GITHUB_WORKSPACE"
          bun test packages/core/test/live.test.ts
