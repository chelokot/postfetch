name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  docs:
    # Keep every exported symbol documented (and free of slow types) — that is
    # what drives the JSR score. Runs without node_modules so deno analyses the
    # zero-dependency source directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno doc --lint --unstable-sloppy-imports packages/core/src/index.ts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t postfetch:ci .

  container-e2e:
    # Builds the showcase image and resolves real posts through the running
    # container end-to-end. Non-gating: datacenter IPs are sometimes throttled.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t postfetch:e2e .
      - name: Resolve real posts through the container
        run: |
          docker run -d --rm -p 3040:3040 --name postfetch postfetch:e2e
          trap 'docker stop postfetch >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            curl -sf -o /dev/null "http://127.0.0.1:3040/?url=https://vt.tiktok.com/ZSxpHvCUM/" && break || sleep 2
          done
          for url in \
            "https://vt.tiktok.com/ZSxpHvCUM/" \
            "https://www.instagram.com/reel/DZ0ixNxtvYq/"; do
            type=$(curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:3040/?url=$url")
            echo "$url -> $type"
            case "$type" in video/mp4|application/zip) ;; *) echo "unexpected content-type"; exit 1 ;; esac
          done

  live:
    # One job per platform for at-a-glance visibility — a red `live (youtube)`
    # is unmistakably YouTube's datacenter-IP bot gate, not a broken resolver.
    # Guards the original regression (a reel resolving to its cover image) and
    # proves the rotating fingerprints are not all blocked. Runner egress is a
    # datacenter IP that some platforms gate, so traffic goes through a free
    # Cloudflare WARP proxy (userspace wgcf + wireproxy, no privileges) to look
    # like a consumer IP; the jobs still report without gating merges.
    name: live (${{ matrix.platform }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [instagram, tiktok, youtube, facebook, twitter, reddit, pinterest, soundcloud]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Resolve live posts (WARP with IP re-roll where the runner IP is gated)
        env:
          POSTFETCH_LIVE: "1"
          POSTFETCH_LIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          # Only YouTube and TikTok gate the datacenter runner IP, so only they
          # resolve through a free userspace Cloudflare WARP proxy (wgcf +
          # wireproxy, no privileges). The free WARP egress is a shared consumer
          # IP that YouTube sometimes rate-limits (429), and some runners drop
          # the WireGuard handshake outright — so each attempt registers a fresh
          # WARP account (new IP), bring-up is time-boxed, and a run that never
          # gets a working tunnel falls back to the runner IP. Other platforms
          # resolve directly. Live jobs are non-gating regardless.
          case "$POSTFETCH_LIVE_PLATFORM" in
            youtube | tiktok) ;;
            *) exec bun test packages/core/test/live.test.ts ;;
          esac

          warp="$RUNNER_TEMP/warp"
          mkdir -p "$warp"
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/v2.2.31/wgcf_2.2.31_linux_amd64" -o "$warp/wgcf"
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/v1.1.2/wireproxy_linux_amd64.tar.gz" | tar -xz -C "$warp" wireproxy
          chmod +x "$warp/wgcf" "$warp/wireproxy"

          warp_pid=""
          stop_warp() { [ -n "$warp_pid" ] && kill "$warp_pid" 2>/dev/null || true; }
          trap stop_warp EXIT

          roll_warp() {
            rm -f "$warp/wgcf-account.toml" "$warp/wgcf-profile.conf"
            ( cd "$warp" && ./wgcf register --accept-tos && ./wgcf generate ) || return 1
            printf '\n[http]\nBindAddress = 127.0.0.1:8080\n' >>"$warp/wgcf-profile.conf"
            stop_warp
            "$warp/wireproxy" --config "$warp/wgcf-profile.conf" >"$warp/wireproxy.log" 2>&1 &
            warp_pid=$!
            for _ in $(seq 1 12); do
              curl -fsS --connect-timeout 3 --max-time 5 -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q 'warp=on' && return 0
              sleep 1
            done
            return 1
          }

          for attempt in 1 2 3; do
            if roll_warp; then
              export HTTP_PROXY=http://127.0.0.1:8080 HTTPS_PROXY=http://127.0.0.1:8080
              echo "WARP is up (attempt $attempt)"
            else
              unset HTTP_PROXY HTTPS_PROXY
              echo "WARP did not come up (attempt $attempt); resolving on the runner IP"
            fi
            bun test packages/core/test/live.test.ts && exit 0
            echo "live $POSTFETCH_LIVE_PLATFORM attempt $attempt failed; rolling the WARP IP"
          done
          exit 1
