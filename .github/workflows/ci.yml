name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/server/Dockerfile -t postfetch:ci .

  live:
    # Hits real Instagram, TikTok and YouTube. It guards the original regression
    # (a reel resolving to its cover image) and proves the rotating fingerprints
    # are not all blocked. Datacenter IPs are sometimes throttled, so this job
    # reports results without gating merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/test/live.test.ts
        env:
          POSTFETCH_LIVE: "1"
