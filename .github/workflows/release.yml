name: Release

# Publishes @postfetch/core to both npm and JSR when a v* tag is pushed, via
# OIDC Trusted Publishing — no tokens or secrets. Each registry needs its trust
# configured once: npm (trusted publisher on the package) and JSR (repo linked
# to the package). The package version is taken from packages/core/package.json.
on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npm publish --access public
        working-directory: packages/core

  jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Sync jsr.json version from package.json
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' packages/core/jsr.json > "$tmp"
          mv "$tmp" packages/core/jsr.json
      - run: npx jsr publish --allow-dirty
        working-directory: packages/core
