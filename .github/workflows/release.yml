name: Release

# Publishes @postfetch/core to npm when a v* tag is pushed, via npm Trusted
# Publishing (OIDC) — no token or secret needed. Requires a trusted publisher
# configured on the package for this repo + this workflow filename.
# prepublishOnly builds dist (bundled ESM + .d.ts).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npm publish --access public
        working-directory: packages/core
